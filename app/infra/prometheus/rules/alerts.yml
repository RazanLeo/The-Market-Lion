groups:
  - name: backend
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "Backend has been down for 1 minute" }
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "5xx error rate > 5% for 2 minutes" }
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "p95 latency > 1s for 5 minutes" }
