name: CI

on:
  push: { branches: [main, develop] }
  pull_request: { branches: [main] }

jobs:
  backend-tests:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install TA-Lib
        run: |
          sudo apt-get update && sudo apt-get install -y wget build-essential
          wget -q https://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar xzf ta-lib-0.4.0-src.tar.gz && cd ta-lib && ./configure --prefix=/usr && make && sudo make install
      - name: Install deps
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Lint + types
        working-directory: backend
        run: |
          pip install ruff mypy
          ruff check app
          # mypy app  # enable once initial typing pass complete
      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          DATABASE_URL_SYNC: postgresql://test:test@localhost:5432/test
          JWT_SECRET: test_secret_value_64_chars_minimum_for_compliance_xxxxxxxxxxxxxxxxxx
          ENCRYPTION_KEY: test_encryption_key_32_bytes_minimum_xxxxxx
          REDIS_URL: redis://localhost:6379/0
        run: pytest -q

  frontend-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run type-check
          npm run build

  docker-build:
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build -t ghcr.io/${{ github.repository_owner }}/the-market-lion-backend:latest -f backend/Dockerfile backend
      - run: docker build -t ghcr.io/${{ github.repository_owner }}/the-market-lion-frontend:latest -f frontend/Dockerfile frontend
      - run: docker push ghcr.io/${{ github.repository_owner }}/the-market-lion-backend:latest
      - run: docker push ghcr.io/${{ github.repository_owner }}/the-market-lion-frontend:latest
