[tool.ruff]
line-length = 140
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "T20", "PT", "RET", "SIM", "ASYNC"]
ignore = ["E501", "S101", "S104", "S105", "S106", "S311", "B008", "N802", "A003"]

[tool.bandit]
skips = ["B101", "B601", "B608"]
exclude_dirs = ["tests", "alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.mypy]
python_version = "3.12"
strict_optional = true
ignore_missing_imports = true
