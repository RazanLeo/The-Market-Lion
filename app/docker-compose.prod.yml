services:
  caddy:
    image: caddy:2-alpine
    container_name: ml_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend

  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: ml_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s

  redis:
    image: redis:7-alpine
    container_name: ml_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  backend:
    image: ghcr.io/razanleo/the-market-lion-backend:latest
    container_name: ml_backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis: { condition: service_started }
    expose: ["8000"]

  worker:
    image: ghcr.io/razanleo/the-market-lion-backend:latest
    container_name: ml_worker
    restart: unless-stopped
    env_file: .env
    depends_on: [backend]
    command: ["celery", "-A", "app.celery_app:celery", "worker", "-l", "info", "-Q", "default,news,indicators,schools,flow,voting,execution", "--concurrency=4"]

  beat:
    image: ghcr.io/razanleo/the-market-lion-backend:latest
    container_name: ml_beat
    restart: unless-stopped
    env_file: .env
    depends_on: [backend]
    command: ["celery", "-A", "app.celery_app:celery", "beat", "-l", "info"]

  frontend:
    image: ghcr.io/razanleo/the-market-lion-frontend:latest
    container_name: ml_frontend
    restart: unless-stopped
    env_file: .env
    depends_on: [backend]
    expose: ["3000"]

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
